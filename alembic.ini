# Alembic configuration for Wallet V2.
#
# The database URL is taken from the environment so the same file works in
# dev, CI, and prod. The Python ``env.py`` overrides ``sqlalchemy.url`` at
# runtime via ``WALLET_V2__DATABASE__URL``.

[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url = postgresql+psycopg://wallet_v2:wallet_v2@localhost:5432/wallet_v2

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
