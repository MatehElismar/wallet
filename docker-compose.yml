services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-v2-postgres
    environment:
      POSTGRES_USER: wallet_v2
      POSTGRES_PASSWORD: wallet_v2
      POSTGRES_DB: wallet_v2
    ports:
      - "5432:5432"
    volumes:
      - wallet-v2-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_v2 -d wallet_v2"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: wallet-v2-api
    environment:
      WALLET_V2__DATABASE__URL: postgresql+psycopg://wallet_v2:wallet_v2@postgres:5432/wallet_v2
      WALLET_V2__ENVIRONMENT: dev
      # The config loader rejects present-but-empty fields. Local compose is a
      # fail-closed reconciliation console: integrations stay disabled unless
      # a deliberate environment override supplies a complete configuration.
      WALLET_V2__MAILBOX__MODE: disabled
      WALLET_V2__MAILBOX__READONLY: "true"
      WALLET_V2__LLM__MODE: disabled
      WALLET_V2__WALLET__MODE: disabled
      WALLET_V2__MCP__MODE: disabled
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: web/
    container_name: wallet-v2-web
    environment:
      WALLET_V2_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  wallet-v2-pgdata:
    # Reuse the existing local development ledger instead of creating a new,
    # branch-namespaced database volume when this UI worktree is started.
    external: true
    name: wallet-v2-wt-integrations_wallet-v2-pgdata
