[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallet-v2"
version = "0.1.0"
description = "Wallet V2 foundation for email-to-Wallet transaction ingestion."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Wallet V2" }]
dependencies = [
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13.2,<2",
    "psycopg[binary]>=3.1.19,<4",
    "pypdf>=5.0.0,<6",
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2,<9",
    "pytest-cov>=5.0.0,<6",
    "httpx>=0.27.0,<1",
]

[project.urls]
Documentation = "https://github.com/anomalyco/wallet-v2"

[project.scripts]
wallet-v2 = "wallet_v2.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wallet_v2"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wallet_v2",
    "tests",
    "alembic",
    "alembic.ini",
    "README.md",
    "pyproject.toml",
    "docker-compose.yml",
    "docs",
]

[tool.pytest.ini_options]
minversion = "8.2"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src/wallet_v2"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
